# REVIEW ONLY. API server flags/volume mounts are cluster-specific.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods", "pods/exec", "pods/attach", "pods/portforward"]
  - level: Metadata
    verbs: ["create", "update", "patch", "delete"]
  - level: None
