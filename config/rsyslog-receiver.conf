# Lab receiver only; bind to a trusted network or add mutual TLS before production.
module(load="imtcp")
input(type="imtcp" port="10514" ruleset="infra_audit_receive")
template(name="infraAuditLine" type="string" string="%msg%\n")
template(name="infraAuditRawLine" type="string"
         string="%timereported:::date-rfc3339% %hostname% %syslogtag% %msg%\n")
ruleset(name="infra_audit_receive") {
  if $syslogtag startswith "infra-audit:" then {
    action(type="omfile" file="/var/log/infra-audit/received.jsonl" template="infraAuditLine")
    stop
  }
  if $syslogtag startswith "infra-audit-shell:" then {
    action(type="omfile" file="/var/log/infra-audit/received-shell-raw.jsonl" template="infraAuditLine")
    stop
  }
  if $syslogtag startswith "infra-audit-auditd:" then {
    action(type="omfile" file="/var/log/infra-audit/received-auditd-raw.log" template="infraAuditRawLine")
    stop
  }
  if $syslogtag startswith "infra-audit-auth:" then {
    action(type="omfile" file="/var/log/infra-audit/received-auth-raw.log" template="infraAuditRawLine")
    stop
  }
  if $syslogtag startswith "rootsh" then {
    action(type="omfile" file="/var/log/infra-audit/received-rootsh-raw.log" template="infraAuditRawLine")
    stop
  }
  if ($syslogtag startswith "pvedaemon" or $syslogtag startswith "pveproxy") then {
    action(type="omfile" file="/var/log/infra-audit/received-pve-raw.log" template="infraAuditRawLine")
    stop
  }
}
